[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "PLC", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
